<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Demo | Luintix</title>
<meta name="description" content="Book a demo of Luintix, aiKart's autonomous order resolution agent.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Red+Hat+Display:wght@300;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chat-widget.css">
<link rel="stylesheet" href="book-demo.css">
</head>
<body>

<main class="demo-page">
    <div class="demo-card">
        <a href="index.html" class="brand demo-brand">
            <img src="assets/logo-mark.png" alt="Luintix" class="brand-mark">
        </a>

        <div class="demo-card-head">
            <a href="index.html" class="demo-exit">Exit</a>
        </div>

        <div class="demo-progress" role="progressbar" aria-label="Form progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" id="demoProgress">
            <div class="demo-progress-bar" id="demoProgressBar"></div>
        </div>

        <form id="demoForm" class="demo-form" novalidate>

            <!-- Step 1 - Contact -->
            <div class="demo-step is-active" data-step="1">
                <h1 class="demo-title">Let's get started</h1>

                <label class="demo-field">
                    <span class="demo-label">Business email <em>*</em></span>
                    <input type="email" id="fieldEmail" name="email" placeholder="jane@yourstore.com" required>
                </label>

                <label class="demo-field">
                    <span class="demo-label">Store URL <em>*</em></span>
                    <input type="text" id="fieldStoreUrl" name="storeUrl" placeholder="yourstore.com" required>
                </label>

                <div class="demo-actions demo-actions-end">
                    <button type="button" class="btn-primary" data-next>Next</button>
                </div>
            </div>

            <!-- Step 2 - Platform -->
            <fieldset class="demo-step" data-step="2">
                <legend class="demo-title">What's your current ecommerce platform?</legend>

                <div class="demo-options demo-options-grid">
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="Shopify">
                        <span>Shopify</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="Shopify Plus">
                        <span>Shopify Plus</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="WooCommerce">
                        <span>WooCommerce</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="BigCommerce">
                        <span>BigCommerce</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="Magento/Adobe Commerce">
                        <span>Magento/Adobe Commerce</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="PrestaShop">
                        <span>PrestaShop</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="Salesforce Commerce Cloud">
                        <span>Salesforce Commerce Cloud</span>
                    </label>
                    <label class="demo-option">
                        <input type="checkbox" name="platform" value="Other" id="platformOther">
                        <span>Other</span>
                    </label>
                    <div class="demo-other-panel" id="platformOtherPanel">
                        <input type="text" id="platformOtherText" name="platformOtherText" placeholder="Enter your platform">
                        <button type="button" class="btn-primary" id="platformOtherAdd">Add</button>
                    </div>
                </div>

                <div class="demo-actions">
                    <button type="button" class="demo-exit" data-back>Back</button>
                    <button type="button" class="btn-primary" data-next disabled>Next</button>
                </div>
            </fieldset>

            <!-- Step 3 - Volume -->
            <fieldset class="demo-step" data-step="3">
                <legend class="demo-title">How many orders do you handle per month?</legend>

                <div class="demo-options demo-options-grid">
                    <label class="demo-option">
                        <input type="radio" name="volume" value="< 100">
                        <span>&lt; 100</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="volume" value="100-1,000">
                        <span>100&ndash;1,000</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="volume" value="1,001-5,000">
                        <span>1,001&ndash;5,000</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="volume" value="5,001-10,000">
                        <span>5,001&ndash;10,000</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="volume" value="> 10,000">
                        <span>&gt; 10,000</span>
                    </label>
                </div>

                <div class="demo-actions">
                    <button type="button" class="demo-exit" data-back>Back</button>
                    <button type="button" class="btn-primary" data-next disabled>Next</button>
                </div>
            </fieldset>

            <!-- Step 4 - Pain point -->
            <fieldset class="demo-step" data-step="4">
                <legend class="demo-title">What's your biggest support headache right now?</legend>

                <div class="demo-options">
                    <label class="demo-option">
                        <input type="radio" name="painPoint" value="Order tracking">
                        <span>Order tracking</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="painPoint" value="Cancellations">
                        <span>Cancellations</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="painPoint" value="Returns & refunds">
                        <span>Returns &amp; refunds</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="painPoint" value="Late shipment complaints">
                        <span>Late shipment complaints</span>
                    </label>
                    <label class="demo-option">
                        <input type="radio" name="painPoint" value="All of the above">
                        <span>All of the above</span>
                    </label>
                </div>

                <div class="demo-actions">
                    <button type="button" class="demo-exit" data-back>Back</button>
                    <button type="submit" class="btn-primary" id="demoSubmitBtn" disabled>Submit</button>
                </div>
            </fieldset>

            <!-- Final screen - Outcome -->
            <div class="demo-step" data-step="5">
                <h2 class="demo-title">Thanks! Here's how to explore Luintix</h2>

                <div class="demo-outcomes">
                    <a href="mailto:hello@aikart.co?subject=Live%20Demo%20Request%20-%20Luintix%20Order%20Agent&body=Hi%20aiKart%20team%2C%0A%0AI'd%20like%20to%20see%20a%20live%20demo%20of%20Luintix.%0A%0ACompany%3A%0AName%3A%0AWork%20Email%3A%0A" class="demo-outcome-card">
                        <span class="demo-outcome-title">See a live demo</span>
                    </a>
                    <a href="mailto:hello@aikart.co?subject=Book%20a%20Call%20-%20Luintix%20Order%20Agent&body=Hi%20aiKart%20team%2C%0A%0AI'd%20like%20to%20book%20a%20call%20to%20discuss%20Luintix.%0A%0ACompany%3A%0AName%3A%0AWork%20Email%3A%0APreferred%20time%3A%0A" class="demo-outcome-card">
                        <span class="demo-outcome-title">Book a call</span>
                    </a>
                    <button type="button" class="demo-outcome-card" id="chatNowBtn">
                        <span class="demo-outcome-title">Chat with us now</span>
                    </button>
                </div>
            </div>

        </form>
    </div>
</main>

<script src="chat-widget.js"></script>
<script src="book-demo.js"></script>
</body>
</html>
